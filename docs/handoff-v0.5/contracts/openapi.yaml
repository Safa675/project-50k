openapi: 3.1.0
info:
  title: Project 50K — Draft API Contract
  version: 0.3.0
  description: Implementation target. No server is deployed. URLs using .invalid are
    documentation identifiers, not functioning services.
servers:
- url: http://localhost:8000/v1
  description: Proposed local API
paths:
  /assets:
    get:
      operationId: searchAssets
      summary: Public canonical search with capability disclosure
      security: []
      x-required-role: PUBLIC
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - &id002
        name: cursor
        in: query
        schema:
          type: string
      - &id003
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: q
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 100
  /assets/{asset_id}:
    get:
      operationId: getAsset
      summary: Get public asset details
      security: []
      x-required-role: PUBLIC
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: asset_id
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
  /assets/{asset_id}/bars:
    get:
      operationId: getBars
      summary: Read permitted final bars; fund intraday is unsupported
      security: []
      x-required-role: PUBLIC
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarPage'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: asset_id
        in: path
        required: true
        schema: *id001
      - *id002
      - *id003
      - name: interval
        in: query
        required: true
        schema:
          type: string
          enum:
          - 1m
          - 5m
          - 15m
          - 1h
          - 1d
      - name: from
        in: query
        schema: &id004
          type: string
          format: date-time
      - name: to
        in: query
        schema: *id004
  /events:
    get:
      operationId: listEvents
      summary: Published, rights-cleared event feed
      security: []
      x-required-role: PUBLIC
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - *id002
      - *id003
      - name: asset_id
        in: query
        schema: *id001
      - name: severity
        in: query
        schema:
          type: string
          enum:
          - MEDIUM
          - HIGH
          - CRITICAL
  /events/{event_id}:
    get:
      operationId: getEvent
      summary: Public event with evidence and provenance
      security: []
      x-required-role: PUBLIC
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEvent'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: event_id
        in: path
        required: true
        schema: *id001
  /me:
    get:
      operationId: getMe
      summary: Verified user profile
      security:
      - BearerAuth: []
      x-required-role: USER
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /me/preferences:
    get:
      operationId: getPreferences
      summary: Own notification preferences
      security:
      - BearerAuth: []
      x-required-role: USER
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      operationId: updatePreferences
      summary: Replace own preferences; record changes
      security:
      - BearerAuth: []
      x-required-role: USER
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
  /watchlist:
    get:
      operationId: getWatchlist
      summary: Own watchlist
      security:
      - BearerAuth: []
      x-required-role: USER
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - *id002
      - *id003
  /watchlist/{asset_id}:
    put:
      operationId: followAsset
      summary: Idempotently follow an asset
      security:
      - BearerAuth: []
      x-required-role: USER
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: asset_id
        in: path
        required: true
        schema: *id001
    delete:
      operationId: unfollowAsset
      summary: Idempotently unfollow an asset
      security:
      - BearerAuth: []
      x-required-role: USER
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: asset_id
        in: path
        required: true
        schema: *id001
  /notifications:
    get:
      operationId: getNotifications
      summary: Own notification inbox
      security:
      - BearerAuth: []
      x-required-role: USER
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - *id002
      - *id003
  /notifications/{notification_id}:
    patch:
      operationId: markNotificationRead
      summary: Mark own notification read
      security:
      - BearerAuth: []
      x-required-role: USER
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: notification_id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadInput'
  /events/{event_id}/feedback:
    put:
      operationId: putFeedback
      summary: Idempotently set usefulness feedback
      security:
      - BearerAuth: []
      x-required-role: USER
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: event_id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackInput'
  /assets/{asset_id}/chat:
    post:
      operationId: askAsset
      summary: Bounded source-backed asset question
      security:
      - BearerAuth: []
      x-required-role: USER
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIAnswer'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: asset_id
        in: path
        required: true
        schema: *id001
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatInput'
  /chat/threads/{thread_id}:
    get:
      operationId: getChatThread
      summary: Own thread; preserve asset and origin
      security:
      - BearerAuth: []
      x-required-role: USER
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatThread'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: thread_id
        in: path
        required: true
        schema: *id001
  /admin/overview:
    get:
      operationId: getAdminOverview
      summary: Safe product/operations summary
      security:
      - BearerAuth: []
      x-required-role: ADMIN
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverview'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /admin/providers:
    get:
      operationId: getProviderHealth
      summary: Source capability and freshness
      security:
      - BearerAuth: []
      x-required-role: ADMIN
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPage'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /admin/jobs:
    get:
      operationId: getJobs
      summary: Safe job status only
      security:
      - BearerAuth: []
      x-required-role: ADMIN
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - *id002
      - *id003
  /admin/settings/{key}:
    patch:
      operationId: updateSetting
      summary: Whitelisted bounded setting with version/reason
      security:
      - BearerAuth: []
      x-required-role: ADMIN
      x-setting-value-schemas:
        rvol_threshold:
          type: number
          minimum: 2
          maximum: 20
        robust_z_threshold:
          type: number
          minimum: 3
          maximum: 10
        chat_daily_turn_limit:
          type: integer
          minimum: 0
          maximum: 50
        ingestion_paused:
          type: boolean
        generation_paused:
          type: boolean
        sending_paused:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          enum:
          - rvol_threshold
          - robust_z_threshold
          - chat_daily_turn_limit
          - ingestion_paused
          - generation_paused
          - sending_paused
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingInput'
  /admin/events/{event_id}/release:
    post:
      operationId: releaseGlobalEvent
      summary: Approve eligible critical event, never bypass guards
      security:
      - BearerAuth: []
      x-required-role: ADMIN
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: event_id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseInput'
  /admin/replays:
    post:
      operationId: createReplay
      summary: Run registered immutable replay; no arbitrary URL
      security:
      - BearerAuth: []
      x-required-role: ADMIN
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobReceipt'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayInput'
  /health:
    get:
      operationId: health
      summary: Minimal liveness response
      security: []
      x-required-role: PUBLIC
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          description: Structured error; ownership checks may return 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /email/unsubscribe:
    post:
      operationId: unsubscribeEmail
      summary: Suppress matching optional email using scoped opaque token
      security: []
      x-required-role: PUBLIC
      responses:
        '200':
          description: Accepted or neutral response without recipient disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        default:
          description: Structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsubscribeInput'
  /me/deletion:
    post:
      operationId: requestAccountDeletion
      summary: Authenticated asynchronous personal-data deletion request
      security:
      - BearerAuth: []
      x-required-role: USER
      responses:
        '202':
          description: Accepted or neutral response without recipient disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobReceipt'
        default:
          description: Structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Asset:
      type: object
      properties:
        asset_id: *id001
        symbol:
          type: string
        name:
          type: string
        asset_class:
          type: string
          enum:
          - BIST_EQUITY
          - TR_INVESTMENT_FUND
          - CRYPTO
          - US_EQUITY
        market:
          type: string
        currency:
          type:
          - string
          - 'null'
        network:
          type:
          - string
          - 'null'
        contract_address:
          type:
          - string
          - 'null'
        price_status:
          type: string
          enum:
          - AVAILABLE
          - STALE
          - UNAVAILABLE
        capabilities:
          type: array
          items:
            type: object
            properties:
              capability:
                type: string
                enum:
                - PRICE
                - INTRADAY
                - NAV
                - AUM_HISTORY
                - INVESTOR_HISTORY
                - ALLOCATION
                - HOLDINGS
                - DISCLOSURES
                - NEWS
                - ONCHAIN
              status:
                type: string
                enum:
                - AVAILABLE
                - DELAYED
                - PARTIAL
                - UNAVAILABLE
                - NOT_TESTED
              as_of: &id006
                anyOf:
                - *id004
                - type: 'null'
              detail_tr:
                type: string
            required:
            - capability
            - status
            - as_of
            - detail_tr
            additionalProperties: false
          minItems: 0
      required:
      - asset_id
      - symbol
      - name
      - asset_class
      - market
      - currency
      - network
      - contract_address
      - price_status
      - capabilities
      additionalProperties: false
    Bar:
      type: object
      properties:
        asset_id: *id001
        source_id:
          type: string
        feed:
          type: string
        origin: &id007
          type: string
          enum:
          - LIVE
          - DELAYED
          - HISTORICAL_REPLAY
          - SYNTHETIC
        interval:
          type: string
          enum:
          - 1m
          - 5m
          - 15m
          - 1h
          - 1d
        start_at: *id004
        end_at: *id004
        available_at: *id004
        is_final:
          type: boolean
        open: &id005
          type: string
          pattern: ^-?\d+(\.\d+)?$
        high: *id005
        low: *id005
        close: *id005
        volume:
          anyOf:
          - *id005
          - type: 'null'
        volume_unit:
          type:
          - string
          - 'null'
        currency:
          type: string
        adjustment:
          type: string
          enum:
          - RAW
          - SPLIT_ADJUSTED
          - TOTAL_RETURN
          - UNKNOWN
      required:
      - asset_id
      - source_id
      - feed
      - origin
      - interval
      - start_at
      - end_at
      - available_at
      - is_final
      - open
      - high
      - low
      - close
      - volume
      - volume_unit
      - currency
      - adjustment
      additionalProperties: false
    Problem:
      type: object
      properties:
        code:
          type: string
        message_tr:
          type: string
        request_id: *id001
        retry_after:
          type: integer
          minimum: 0
      required:
      - code
      - message_tr
      - request_id
      additionalProperties: false
    Preferences:
      type: object
      properties:
        sensitivity:
          type: string
          enum:
          - CRITICAL_ONLY
          - IMPORTANT
          - ALL_SUPPORTED
        personal_email:
          type: boolean
        global_critical_email:
          type: boolean
        digest:
          type: string
          enum:
          - 'OFF'
          - DAILY
        timezone:
          type: string
          const: Europe/Istanbul
        locale:
          type: string
          const: tr-TR
      required:
      - sensitivity
      - personal_email
      - global_critical_email
      - digest
      - timezone
      - locale
      additionalProperties: false
    Event:
      $ref: event.schema.json
    PublicEvent:
      $ref: public_event.schema.json
    AIAnswer:
      $ref: ai_answer.schema.json
    Notification:
      type: object
      properties:
        notification_id: *id001
        event_id: *id001
        event_revision:
          type: integer
          minimum: 1
        title_tr:
          type: string
        read_at: *id006
        created_at: *id004
        delivery_class:
          type: string
          enum:
          - PERSONAL
          - GLOBAL_CRITICAL
          - DIGEST
          - UPDATE
          - CORRECTION
      required:
      - notification_id
      - event_id
      - event_revision
      - title_tr
      - read_at
      - created_at
      - delivery_class
      additionalProperties: false
    User:
      type: object
      properties:
        user_id: *id001
        display_name:
          type: string
        role:
          type: string
          enum:
          - USER
          - ADMIN
        locale:
          type: string
          const: tr-TR
      required:
      - user_id
      - display_name
      - role
      - locale
      additionalProperties: false
    FeedbackInput:
      type: object
      properties:
        value:
          type: string
          enum:
          - USEFUL
          - NOT_RELEVANT
      required:
      - value
      additionalProperties: false
    ChatInput:
      type: object
      properties:
        question_tr:
          type: string
          minLength: 1
          maxLength: 2000
        thread_id:
          anyOf:
          - *id001
          - type: 'null'
        origin: *id007
        replay_cutoff: *id006
        replay_bundle_id:
          anyOf:
          - *id001
          - type: 'null'
      required:
      - question_tr
      - origin
      - replay_cutoff
      - replay_bundle_id
      additionalProperties: false
      allOf:
      - if:
          properties:
            origin:
              const: HISTORICAL_REPLAY
        then:
          properties:
            replay_cutoff:
              type: string
              format: date-time
            replay_bundle_id:
              type: string
              format: uuid
        else:
          properties:
            replay_cutoff:
              type: 'null'
            replay_bundle_id:
              type: 'null'
    ChatThread:
      type: object
      properties:
        thread_id: *id001
        asset_id: *id001
        origin: *id007
        replay_cutoff: *id006
        replay_bundle_id:
          anyOf:
          - *id001
          - type: 'null'
        messages:
          type: array
          items:
            type: object
            properties:
              message_id:
                type: string
                format: uuid
              role:
                type: string
                enum:
                - USER
                - ASSISTANT
              content_tr:
                type: string
              created_at:
                type: string
                format: date-time
              validated_answer:
                anyOf:
                - $ref: '#/components/schemas/AIAnswer'
                - type: 'null'
            required:
            - message_id
            - role
            - content_tr
            - created_at
            - validated_answer
            additionalProperties: false
      required:
      - thread_id
      - asset_id
      - origin
      - replay_cutoff
      - replay_bundle_id
      - messages
      additionalProperties: false
      allOf:
      - if:
          properties:
            origin:
              const: HISTORICAL_REPLAY
        then:
          properties:
            replay_cutoff:
              type: string
              format: date-time
            replay_bundle_id:
              type: string
              format: uuid
        else:
          properties:
            replay_cutoff:
              type: 'null'
            replay_bundle_id:
              type: 'null'
    SettingInput:
      type: object
      properties:
        value:
          anyOf:
          - type: boolean
          - type: number
        expected_version:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 10
          maxLength: 500
      required:
      - value
      - expected_version
      - reason
      additionalProperties: false
    ReleaseInput:
      type: object
      properties:
        expected_revision:
          type: integer
          minimum: 1
        reason:
